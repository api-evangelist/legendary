openapi: 3.1.0
info:
  title: Legendary Entertainment WordPress REST API
  version: wp/v2
  description: 'Read-oriented content API exposed by legendary.com: the WordPress REST API (namespace
    wp/v2) serving Legendary Entertainment news posts, pages, media, categories and tags. Derived by API
    Evangelist from the live route discovery document at https://www.legendary.com/wp-json/wp/v2 . This
    is the platform API exposed by the marketing site, NOT a documented first-party Legendary developer
    program. GET collections are publicly readable without authentication; write operations require WordPress
    Application Password credentials.'
  contact:
    name: Legendary Entertainment
    url: https://www.legendary.com/about/
servers:
- url: https://www.legendary.com/wp-json/wp/v2
  description: Production
tags:
- name: block-directory
- name: block-patterns
- name: block-renderer
- name: block-types
