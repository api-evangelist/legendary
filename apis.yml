aid: legendary
name: Legendary Entertainment
description: >-
  Legendary Entertainment is a Burbank, California media company that owns, produces and
  distributes content to worldwide audiences across three divisions: Legendary Pictures
  (film), Legendary Television and Digital Media, and Legendary Comics. Its productions
  have grossed more than $20 billion worldwide at the box office, spanning franchises such
  as Dune, Godzilla and Kong, A Minecraft Movie, Street Fighter, Enola Holmes and Monarch:
  Legacy of Monsters, with an explicit focus on the fandom demographic. Legendary runs no
  public developer program and publishes no documented API. It does, however, expose a
  live, publicly readable WordPress REST API on legendary.com that serves its news posts
  and its film, television, comics, trailer and digital catalogs as JSON — captured here as
  a platform-exposed content API rather than a supported product.
